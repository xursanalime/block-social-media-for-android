import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'app.reelsblock'
    compileSdk 36

    defaultConfig {
        applicationId 'app.reelsblock'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Repoda turadigan doimiy debug kalit: har bir yangi APK eskisining ustidan
    // o'rnatiladi (aks holda har safar o'chirib qayta o'rnatish kerak bo'lardi).
    signingConfigs {
        debug {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}
